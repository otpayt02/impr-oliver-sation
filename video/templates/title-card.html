<!-- Title card (handoff §5 step 4 / §7 tokens): dark #07070b, Georgia serif,
     purple subject, green predicate. Edit the two spans per video; that's the whole job. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title Card</title>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #07070b; font-family: Georgia, serif; }
  .card { text-align: center; }
  .subject { display: block; font-size: 64px; letter-spacing: 0.08em; color: #a855f7; }
  .predicate { display: block; font-size: 28px; margin-top: 12px; color: #4ade80; }
  .wordmark { display: block; margin-top: 40px; font-family: monospace; font-size: 14px;
              letter-spacing: 0.3em; color: #93c5fd; }
</style>
</head>
<body>
  <div class="card">
    <span class="subject">FIRST HOUR IMPROV</span>
    <span class="predicate">no sheet music</span>
    <span class="wordmark">AP MUSIC &amp; AUDIO</span>
  </div>
</body>
</html>
